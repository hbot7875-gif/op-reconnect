<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC Giveaway</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Recording view for the PC Giveaway. A 1080×1920 Instagram Story frame,
     scaled to the window. Content stays inside the Story safe area
     (y 250–1670). No admin controls are ever drawn inside the frame. */
  :root { --bg: #120D1F; --soft: #c9b8f2; --glow: rgba(140,105,220,.35); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); font-family: Poppins, system-ui, sans-serif; overflow: hidden; }
  .wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .stage { width: 1080px; height: 1920px; position: relative; flex: none; transform-origin: center; color: #fff; overflow: hidden;
    background: radial-gradient(70% 40% at 50% 46%, #22183a 0%, var(--bg) 70%); }
  .head { position: absolute; top: 262px; left: 0; right: 0; text-align: center; }
  .head h1 { font-size: 92px; font-weight: 800; letter-spacing: 2px; line-height: 1; }
  .head p { margin-top: 20px; font-size: 34px; font-weight: 600; letter-spacing: 12px; color: var(--soft); }
  .wheelbox { position: absolute; left: 50%; top: 470px; width: 980px; height: 980px; margin-left: -490px; }
  canvas#wheel { width: 980px; height: 980px; border-radius: 50%; box-shadow: 0 0 0 6px rgba(201,184,242,.55), 0 0 70px var(--glow); }
  .pointer { position: absolute; left: 50%; top: -30px; margin-left: -30px; width: 0; height: 0; border-left: 30px solid transparent;
    border-right: 30px solid transparent; border-top: 58px solid #f3edff; filter: drop-shadow(0 4px 10px rgba(140,105,220,.7)); z-index: 2; }
  .hub { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: var(--bg);
    box-shadow: 0 0 0 5px rgba(201,184,242,.6), 0 0 30px var(--glow); display: flex; align-items: center; justify-content: center; font-size: 46px; }
  .below { position: absolute; left: 50%; top: 1470px; width: 940px; height: 196px; margin-left: -470px; display: flex; align-items: center; justify-content: center; }
  .spin { width: 380px; height: 112px; border: 1.5px solid rgba(201,184,242,.7); border-radius: 56px; background: #2a1f45; color: #fff;
    font: 700 44px Poppins, sans-serif; letter-spacing: 8px; box-shadow: 0 0 30px var(--glow); cursor: pointer; transition: opacity .4s; }
  .spin[disabled] { opacity: 0; pointer-events: none; }
  .spin[hidden] { display: none; }
  .card { position: absolute; inset: 0; border-radius: 36px; background: #1b1430; border: 1.5px solid rgba(201,184,242,.55); box-shadow: 0 0 40px var(--glow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 40px; opacity: 0; transform: translateY(16px);
    transition: opacity .7s, transform .7s; pointer-events: none; }  /* sits over SPIN until shown; never catch its clicks */
  .card.on { opacity: 1; transform: none; }
  .card .t { font-size: 38px; font-weight: 700; letter-spacing: 2px; color: var(--soft); line-height: 1.3; }
  .card .w { margin: 4px 0 2px; font-size: 72px; font-weight: 800; white-space: nowrap; line-height: 1.2; max-width: 100%; }
  .card .c { font-size: 34px; font-weight: 600; opacity: .9; line-height: 1.3; }
  .foot { position: absolute; top: 1690px; left: 0; right: 0; text-align: center; font-size: 24px; font-weight: 500; letter-spacing: 4px; color: rgba(201,184,242,.6); }
  canvas#fx { position: absolute; inset: 0; width: 1080px; height: 1920px; pointer-events: none; z-index: 6; }
  /* Test mode only: a small tag above the Story safe area. */
  .test-tag { position: absolute; top: 60px; left: 60px; font: 600 26px Poppins, sans-serif; letter-spacing: 3px; color: #f0b7d8;
    border: 1.5px solid #f0b7d8; border-radius: 30px; padding: 6px 22px; }
  /* Shown instead of the frame when the view can't be used (no key, list not frozen). */
  .notice { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px;
    color: #e9e1fb; font: 500 16px system-ui, sans-serif; line-height: 1.6; background: var(--bg); z-index: 10; }
  .notice.on { display: flex; }
  .notice a { color: #c9b8f2; }
</style>
</head>
<body>
<div class="wrap"><div class="stage" id="stage">
  <div class="test-tag" id="testTag" hidden>TEST SPIN · NOT OFFICIAL</div>
  <div class="head"><h1>PC GIVEAWAY 💜</h1><p id="team">TEAM</p></div>
  <div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="1960" height="1960"></canvas><div class="hub">💜</div></div>
  <div class="below">
    <button class="spin" id="spin" type="button" hidden>SPIN</button>
    <div class="card" id="card"><div class="t">WE HAVE A WINNER! 🎉</div><div class="w" id="wname"></div><div class="c">Congratulations!!</div></div>
  </div>
  <div class="foot">HopeTrackers • MAMA 2026</div>
  <canvas id="fx" width="1080" height="1920"></canvas>
</div></div>
<div class="notice" id="notice"></div>
<script type="module" src="./js/giveaway-wheel.js"></script>
</body>
</html>
