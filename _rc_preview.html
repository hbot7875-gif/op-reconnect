      // to this preview still shows something sensible.
      'attack':             { progress: 640, yourStreams: 18, defenderAgents: 14 },
      'attack-compromised': { progress: 120, yourStreams: 18, defenderAgents: 5 },
      'attack-final':       { progress: 950, yourStreams: 18, defenderAgents: 23 },
      'attack-nodefender':  { progress: 640, yourStreams: 0,  defenderAgents: 14 },
      'defused':            { progress: 1000, yourStreams: 18, defenderAgents: 24, resolved: 'defused' },
      'blackout':           { progress: 860, yourStreams: 18, defenderAgents: 21, resolved: 'failed' },
    }
    // Longest match wins: '#attack-nodefender' contains 'attack' too, and
    // plain insertion order would quietly hand it the wrong fixture.
    const rzKey = Object.keys(RZ_STAGES)
      .filter((k) => location.hash.includes(k))
      .sort((a, b) => b.length - a.length)[0]
    if (rzKey) {
      const s = RZ_STAGES[rzKey]
      if (s.resolved) {
        try { localStorage.removeItem('rc_last_defuse_result_shown') } catch (_) {}
        STATE.bomb.resolvedDefuse = {
          id: RZ_ID, status: s.resolved, title: 'THE NETWORK IS UNDER ATTACK',
          target: RZ_TARGET, progress: s.progress, rewardXp: 500, minimumStreams: 7,
          defenderAgents: s.defenderAgents, yourStreams: s.yourStreams, isQualified: true,
          yourXpAwarded: s.resolved === 'defused' ? 62 : 0,
        }
        // Real Blackout wiring: applyBlackout() sets charged_until to now(),
        // so the very next agentCharge read already sees isDark:true — the
        // Bomb goes dark automatically through the existing brownout look,
        // no special-cased "blackout Bomb" skin needed. Mirrored here so
        // the preview shows what production will actually render.
        if (s.resolved === 'failed') { AGENT_CHARGE.isDark = true; AGENT_CHARGE.hoursRemaining = 0 }
      } else {
        STATE.bomb.defuse = {
          id: RZ_ID, title: 'THE NETWORK IS UNDER ATTACK',
          message: 'An infiltrator is draining the core. Stream together to defuse it.',
          progress: s.progress, target: RZ_TARGET, yourStreams: s.yourStreams,
          minimumStreams: 7, qualifiedAgents: Math.max(0, s.defenderAgents - 2),
          defenderAgents: s.defenderAgents, rewardXp: 500,
          activeUntil: new Date(Date.now() + (2 * 3600 + 47 * 60 + 12) * 1000).toISOString(),
          isDefender: s.yourStreams >= 1, isQualified: s.yourStreams >= 7,
          // Matches DC_MESSAGES below, so the unread badge has something
          // real to count against whatever this device has already seen.
          messageCount: 6,
          defenderRanking: {
            total: s.defenderAgents,
            leaders: [
              { rank: 1, codename: 'signalbloom', streams: 76, isMe: false },
              { rank: 2, codename: 'violetorbit', streams: 61, isMe: false },
              { rank: 3, codename: 'starrykoo', streams: 43, isMe: false },
              { rank: 4, codename: 'AGENT VIOLET', streams: s.yourStreams, isMe: true },
              { rank: 5, codename: 'namjooning', streams: 16, isMe: false },
              ...Array.from({ length: Math.max(0, s.defenderAgents - 5) }, (_, i) => ({
                rank: i + 6, codename: `defender${String(i + 6).padStart(2, '0')}`,
                streams: Math.max(1, 15 - i), isMe: false,
              })),
            ],
            yourRank: { rank: 4, codename: 'AGENT VIOLET', streams: s.yourStreams, isMe: true },
          },
        }
        // PREVIEW ONLY: #track / #album attaches a per-event streaming
        // target so the generated instruction can be reviewed in both
        // shapes (see redZoneTarget() in js/red-zone-ui.js). No such column
        // exists yet — with neither hash the fixture matches production,
        // where any eligible BTS play counts and the copy says exactly that.
        // #mix is the shape a real multi-pick launch produces: several
        // entries, kinds allowed to differ. #album/#track keep exercising
        // the older single-target fields an in-flight event may still have.
        if (location.hash.includes('mix')) {
          STATE.bomb.defuse.targetKind = 'track'
          STATE.bomb.defuse.targetNames = [
            { name: 'ARIRANG', kind: 'album' },
            { name: 'Keep Swimming', kind: 'track' },
          ]
        } else if (location.hash.includes('album')) STATE.bomb.defuse.targetAlbum = 'ARIRANG'
        else if (location.hash.includes('track')) STATE.bomb.defuse.targetTrack = 'Haegeum'
      }
    }
    // ARMY Comms preview thread — the same realistic sample messages at
    // every stage, so only the background glow changes between screenshots.
    // Mutable so posting in the sheet reflects back into the list without a
    // page reload.
    const DC_MESSAGES = [
      { isMe: false, isSystem: true, body: 'ARMY Comms unlocked — the signal is compromised.' },
      { isMe: false, codename: 'signalbloom', body: 'pushing Arirang on repeat, join in!' },
      { isMe: false, codename: 'violetorbit', body: 'streaming from two accounts rn' },
      { isMe: true, codename: 'You', body: 'on it 💜' },
      { isMe: false, isSystem: true, body: '500 / 1,000 streams — halfway there.' },
      { isMe: false, codename: 'signalbloom', body: 'almost there army lets goo' },
    ]

    // ReConnect simplification fixtures. These stay inside the local preview
    // harness and deliberately exercise the same rendering path as the game.
    const reconnectPreview = location.hash.match(/reconnect-([a-z0-9]+)/)?.[1] || ''
    let RECONNECT_RESPONSE = null
    let RECONNECT_CANDIDATES = []
    if (reconnectPreview) {
      STATE.activeDistrict.reconnect = {
        id: 'connect-swim', label: 'SWIM Signal Link', variant: 'connect', done: false,
      }
      const me = { agentNo: 'AGENT000', codename: 'moonchild7', status: 'joined', isMe: true, streams: 6 }
      const teammate = { agentNo: 'AGENT053', codename: 'purplewhale', status: 'joined', isMe: false, streams: 5 }
      const third = { agentNo: 'AGENT086', codename: 'starlight7', status: 'joined', isMe: false, streams: 3 }
      const mission = {
        id: 'preview-mission', status: 'open', requiredAgents: reconnectPreview === 'healthy3' ? 3 : 2,
        isCreator: true, expiresAt: new Date(Date.now() + 5 * 86400000).toISOString(),
        sharedTrack: { label: 'SWIM', progress: 11, target: 25 }, messages: [], participants: [me],
      }
      if (reconnectPreview === 'pending') {
        mission.participants.push({ agentNo: 'AGENT053', codename: 'purplewhale', status: 'invited', isMe: false })
      } else if (reconnectPreview === 'expired') {
        mission.participants.push({ agentNo: 'AGENT053', codename: 'purplewhale', status: 'invited', inviteExpired: true, removable: true, isMe: false })
      } else if (reconnectPreview === 'healthy2' || reconnectPreview === 'extended') {
        mission.participants.push(teammate)
      } else if (reconnectPreview === 'healthy3') {
        mission.participants.push(teammate, third)
        mission.sharedTrack = { label: 'SWIM', progress: 14, target: 25 }
      } else if (reconnectPreview === 'complete') {
        mission.status = 'complete'
        mission.participants.push(teammate)
        mission.sharedTrack = { label: 'SWIM', progress: 25, target: 25 }
      }
      if (reconnectPreview === 'extended') {
        STATE.activeDistrict.expiresAt = new Date(Date.now() + 8 * 86400000).toISOString()
        STATE.activeDistrict.daysLeft = 8
        STATE.activeDistrict.deadlineExtended = true
      }
      if (reconnectPreview === 'puzzle') {
        STATE.activeDistrict.reconnect = {
          id: 'cipher-signal', label: 'Lost Frequency', variant: 'cipher', done: false,
          prompt: 'Decode the final word in the signal.', attemptsLeft: 0,
        }
      } else {
        RECONNECT_RESPONSE = {
          success: true, available: true, variant: 'connect',
          config: { requiredAgents: mission.requiredAgents, sharedTrack: { label: 'SWIM', target: 25 } },
          mission,
        }
      }
      RECONNECT_CANDIDATES = [
        { agentNo: 'AGENT114', codename: 'signalbloom', online: true, waitingSince: new Date(Date.now() - 25 * 60000).toISOString() },
        { agentNo: 'AGENT050', codename: 'violetorbit', online: false, waitingSince: new Date(Date.now() - 4 * 3600000).toISOString() },
      ]
    }

    // #onboard replays a brand-new agent's first run (joined: false).
    const ONBOARD = {
      success: true, joined: false,
      intro: {
        title: 'INCOMING TRANSMISSION',
        chapter: 'Operation: ReConnect',
        welcome: 'Welcome, Agent.',
        securityNotice: 'Your Agent Number is classified. Never reveal it — not every signal on this grid is friendly.',
        body: "After the old tracking network collapsed, HT lost contact with hundreds of agents worldwide.\n\nTo ReConnect them, HT built a new intelligence network called BOTZ, powered by ARMY Bombs. But its signal is unstable.\n\nEvery stream you log restores a piece of the network.\n\nWhen your ARMY Bomb loses power, parts of the city go dark again.\n\nStream to earn Charge Cells.\nUse them to keep your ARMY Bomb glowing.\n\nRestore the city.\nFind the missing agents.\nReConnect the network.\n\nWelcome to Operation ReConnect.",
      },
      modes: {
        easy:   { label: 'Easy',   multiplier: 1 },
        medium: { label: 'Medium', multiplier: 2 },
        hard:   { label: 'Hard',   multiplier: 4 },
      },
    }

    const realFetch = window.fetch
    window.fetch = async (url, opts) => {
      if (String(url).includes('op-reconnect')) {
        const body = JSON.parse(opts?.body || '{}')
        if (body.action === 'getGameState') {
          const on = location.hash.includes('onboard')
          return { json: async () => JSON.parse(JSON.stringify(on ? ONBOARD : STATE)) }
        }
        if (body.action === 'joinGame') {
          return { json: async () => ({ ...JSON.parse(JSON.stringify(STATE)), success: true, joined: true }) }
        }
        if (body.action === 'getAccount') {
          return { json: async () => ({ success: true, account: {
            agentNo: 'AGENT000', handle: 'agent-violet', email: 'violet@example.com',
            streamSource: 'lb', lbUsername: 'agent-violet', hasPin: true,
            createdAt: '2026-08-01T00:00:00.000Z',
          } }) }
        }
        if (body.action === 'getAgentCharge') {
          return { json: async () => ({ success: true, charge: JSON.parse(JSON.stringify(AGENT_CHARGE)) }) }
        }
        if (body.action === 'getDefuseMessages') {
          if (STATE.bomb.defuse && !STATE.bomb.defuse.isDefender) {
            return { json: async () => ({ success: false, error: 'not_a_defender' }) }
          }
          const readOnly = !STATE.bomb.defuse // resolved (defused/blackout hashes) — archived
          return { json: async () => ({ success: true, readOnly, messages: JSON.parse(JSON.stringify(DC_MESSAGES)) }) }
        }
        if (body.action === 'sendDefuseMessage') {
          if (!STATE.bomb.defuse) return { json: async () => ({ success: false, error: 'event_resolved' }) }
          DC_MESSAGES.push({ isMe: true, codename: 'You', body: String(body.message || '').slice(0, 240) })
          return { json: async () => ({ success: true }) }
        }
        if (body.action === 'getReconnectMission' && RECONNECT_RESPONSE) {
          return { json: async () => JSON.parse(JSON.stringify(RECONNECT_RESPONSE)) }
        }
        if (body.action === 'getInviteCandidates' && reconnectPreview) {
          return { json: async () => ({ success: true, candidates: JSON.parse(JSON.stringify(RECONNECT_CANDIDATES)), stillOnHomeBase: 0, alertActive: false }) }
        }
        if (body.action === 'feedCharge') {
          if (AGENT_CHARGE.chargeCells < 1) return { json: async () => ({ success: false, error: 'not_enough_charge_cells' }) }
          AGENT_CHARGE.chargeCells -= 1
          STATE.player.chargeCells = AGENT_CHARGE.chargeCells
          AGENT_CHARGE.hoursRemaining += 4
          AGENT_CHARGE.isDark = false
          return { json: async () => ({
            success: true,
            chargedUntil: new Date(Date.now() + AGENT_CHARGE.hoursRemaining * 3_600_000).toISOString(),
          }) }
        }
        if (body.action === 'setAutoFeed') {
          AGENT_CHARGE.autoFeed = !!body.on
          return { json: async () => ({ success: true, autoFeed: AGENT_CHARGE.autoFeed }) }
        }
        if (body.action === 'useLitEra') {
          const card = AGENT_CHARGE.eraCards.find(x => x.id === body.eraId)
          if (!card || card.status !== 'lit') return { json: async () => ({ success: false, error: 'era_card_not_ready' }) }
          card.status = 'used'
          AGENT_CHARGE.litEras = AGENT_CHARGE.litEras.filter(id => id !== card.id)
          AGENT_CHARGE.newlyLitEraIds = []
          AGENT_CHARGE.hoursRemaining += 10
          return { json: async () => ({
            success: true, eraId: card.id, hoursAdded: 10,
            chargedUntil: new Date(Date.now() + AGENT_CHARGE.hoursRemaining * 3_600_000).toISOString(),
          }) }
        }
        if (body.action === 'setEquippedBadge') {
          STATE.player.equippedBadgeId = body.badgeId
          return { json: async () => ({ success: true, equippedBadgeId: body.badgeId }) }
        }
        // Collectibles: persist against the mock STATE so moves survive a re-render.
        if (body.action === 'placeItem') {
          const it = STATE.items.find(x => x.id === body.playerItemId)
          if (it) {
            it.districtId = body.districtId
            const d = districts.find(x => x.id === body.districtId)
            it.districtName = d ? d.name : null
          }
          return { json: async () => ({ success: true }) }
        }
        if (body.action === 'useItem') {
          const it = STATE.items.find(x => x.id === body.playerItemId)
          if (it) it.usedAt = new Date().toISOString()
          return { json: async () => ({ success: true }) }
        }
        // The district Vault row shows a real count in production; without a
        // stub here it always read "0 playlists", which makes the row look
        // broken rather than secondary when reviewing the layout.
        if (body.action === 'getCandyPlaylistLibrary') {
          return { json: async () => ({ success: true, total: 374, items: [], savedIds: [] }) }
        }
        // ── auth stubs (the real ones live in the op-reconnect function) ──
        if (body.action === 'registerAgent') {
          if (String(body.handle).toLowerCase() === 'taken') {
            return { json: async () => ({ success: false, error: 'handle_taken' }) }
          }
          localStorage.removeItem('rc_onboarded')
          return { json: async () => ({ success: true, agent: { agentNo: 'AGENT042', handle: body.handle, sessionToken: 'mock-token' } }) }
        }
        if (body.action === 'loginAgent') {
          if (body.password !== 'correct') {
            return { json: async () => ({ success: false, error: 'bad_credentials' }) }
          }
          return { json: async () => ({ success: true, agent: { agentNo: body.agentNo, handle: 'hopesizeyouknow', sessionToken: 'mock-token' } }) }
        }
        return { json: async () => ({ ...JSON.parse(JSON.stringify(STATE)), success: true }) }
      }
      return realFetch(url, opts)
    }
  </script>
</head>
<body>
  <div id="auth" hidden></div>
  <div id="loading" class="center-screen">
    <div class="panel"><div class="scan-pulse"></div><div class="eyebrow">ESTABLISHING UPLINK…</div></div>
  </div>
  <div id="onboarding" hidden></div>
  <div id="game" hidden>
    <header id="hud"></header>
    <nav id="tabbar"></nav>
    <main id="scene" class="scene"></main>
    <footer class="page-foot">
      HopeTracker • OP: ReConnect
      <span class="love">"Every mission begins with a single stream." 💜</span>
    </footer>
  </div>
  <div id="overlay" hidden></div>
  <!-- concert_voyage.js expects these four to already exist — its own header
       says they're declared in app.js and must not be re-declared there. This
       page doesn't load app.js, so the host declares them instead. Without
       this, changeBombColor and the strobe throw ReferenceError. -->
  <script>var concertPlayer, strobeInterval, waveInterval, progressInterval;</script>
  <script src="concert_voyage.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    // PREVIEW ONLY: jump straight to the district so the moment plays.
    if (location.hash.includes('restored') || location.hash.includes('wardwhole') || location.hash.includes('reconnect-')) {
      const { goDistrict } = await import('./js/router.js')
      const t = setInterval(() => {
        if (window.__rcState?.joined) {
          clearInterval(t)
          goDistrict('mono', 'mono-7')
          // PREVIEW ONLY: '#...-toqueue' parks the board at Build today's
          // queue, so a screenshot of the Queue / Vault / Track Mission
          // hierarchy is reproducible instead of hand-scrolled.
          if (location.hash.includes('toqueue')) {
            setTimeout(() => {
              const q = document.querySelector('.queue-btn')
              if (q) { q.scrollIntoView({ block: 'start' }); window.scrollBy(0, -70) }
            }, 900)
          }
        }
      }, 200)
    }
    // PREVIEW ONLY: open the Red Zone details sheet or ARMY Comms
    // directly from a hash, so every state is reachable by URL alone —
    // useful for screenshotting without depending on a working click (the
    // sheet is still reached by tapping the compromised Bomb in normal
    // play; this is a shortcut, not a new entry point).
    //   #<stage>-sheet  → redZoneSheet / defuseResultSheet
    //   #<stage>-comms  → defenderCommsSheet, straight to the thread
    if (location.hash.includes('-sheet') || location.hash.includes('-comms')) {
      const [{ showOverlay }, { redZoneSheet, defenderCommsSheet, defuseResultSheet }] =
        await Promise.all([import('./js/state.js'), import('./js/bomb-sheet.js')])
      const t = setInterval(() => {
        const state = window.__rcState
        if (!state?.joined) return
        clearInterval(t)
        const d = state.bomb?.defuse
        const r = state.bomb?.resolvedDefuse
        if (location.hash.includes('-comms')) {
          if (d) showOverlay(defenderCommsSheet({ eventId: d.id, progress: d.progress, target: d.target, defenderAgents: d.defenderAgents }))
          else if (r) showOverlay(defenderCommsSheet({ eventId: r.id, progress: r.progress, target: r.target, defenderAgents: r.defenderAgents, blackout: r.status === 'failed' }))
        } else {
          if (d) showOverlay(redZoneSheet(state))
          else if (r) showOverlay(defuseResultSheet(r))
        }
      }, 200)
    }
    // PREVIEW ONLY: birthday stages open the real City marker automatically
    // after the normal World screen has mounted. This keeps 320/375 captures
    // deterministic without adding a second Golden Corner implementation.
    if (location.hash.includes('golden-')) {
      const t = setInterval(() => {
        const marker = document.querySelector('.cm-tool.is-golden-dark, .cm-tool.is-golden-live, .cm-tool.is-golden-complete')
        if (!marker) return
        clearInterval(t)
        marker.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: innerWidth / 2, clientY: innerHeight / 2 }))
      }, 200)
    }
  </script>
</body>
</html>
