name: Fleet stream sync (manual)

# Calls adminSyncAllStreams (supabase/functions/op-reconnect/lib/sync-all.ts)
# for every agent, one slice at a time — the same thing pg_cron now does every
# hour (migration 20261110150500_rc_fleet_sync_schedule.sql). The schedule
# that used to live here ('0 * * * *') fired only every 4-8 hours, and a
# single whole-fleet call often died with WORKER_RESOURCE_LIMIT, so this is a
# manual "Run workflow" button now, for an immediate recount.
#
# Requires one repo secret: SYNC_ADMIN_KEY, the same key admin.html and
# botz.html already use — Settings → Secrets and variables → Actions →
# New repository secret. Never put the key itself in this file.

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger adminSyncAllStreams, six slices
        env:
          SYNC_ADMIN_KEY: ${{ secrets.SYNC_ADMIN_KEY }}
        run: |
          if [ -z "$SYNC_ADMIN_KEY" ]; then
            echo "::error::SYNC_ADMIN_KEY repo secret is not set — see this workflow's header comment."
            exit 1
          fi
          failed=0
          for slice in 0 1 2 3 4 5; do
            resp=$(curl -sS -w '\n%{http_code}' -X POST \
              "https://lcvmwlioqpyaprxicdfl.supabase.co/functions/v1/op-reconnect" \
              -H "Content-Type: application/json" \
              -H "x-region: ap-northeast-2" \
              -d "{\"action\":\"adminSyncAllStreams\",\"adminKey\":\"$SYNC_ADMIN_KEY\",\"slice\":$slice,\"slices\":6}")
            status="${resp##*$'\n'}"
            body="${resp%$'\n'*}"
            echo "$body"
            if [ "$status" != "200" ] || ! echo "$body" | jq -e '.success == true' > /dev/null; then
              echo "::error::slice $slice: HTTP $status"
              failed=1
              continue
            fi
            echo "$body" | jq -r '"Slice \(.slice.slice): synced \(.synced)/\(.total) agents, \(.failed) failed"'
          done
          exit $failed
